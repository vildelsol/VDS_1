# Builds the single-file Windows program: one .exe, nothing else to install.
#
# GitHub does not build this automatically — this file is what tells it to.
# It runs on a real Windows machine (GitHub does not offer a way to build a
# genuine .exe from macOS or Linux), bundles the server and embeds the built
# client app *inside* the executable itself (see scripts/build-sea-assets.mjs
# and server.ts), then verifies the result actually runs before publishing it.
#
# Two ways it starts:
#   - Pushing a tag like "v1.0.0" also publishes the .exe to that release.
#   - The "Run workflow" button on the Actions tab, any time, for a build to
#     download and hand to someone without cutting a release.
name: Build Windows executable

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # `npm ci` installs exactly what package-lock.json pins and fails if the
      # lockfile and package.json disagree — so a release can never be built
      # from a dependency tree nobody recorded.
      - name: Install dependencies
        run: npm ci

      # A release carries tenants' financial records on a machine that sits on a
      # desk in an office. A dependency with a known advisory must not reach it
      # silently. This gates the build: high and critical advisories stop the
      # release rather than being reported into a log nobody reads.
      #
      # Deliberately `--omit=dev`: a vulnerability in esbuild or vite is a
      # build-time concern, not something shipped inside the .exe, and failing a
      # release over it would train whoever runs this to ignore the step.
      - name: Check dependencies for known advisories
        run: npm audit --omit=dev --audit-level=high

      # Typecheck before the suite: a type error is a faster, clearer failure
      # than whatever it eventually causes at run time.
      - name: Typecheck
        run: npm run lint

      # Run the same automated suite that gates every change on the test PC,
      # so a build that would fail on a real machine never reaches Releases.
      - name: Run the test suite
        run: npm test

      - name: Build the client and the self-contained server bundle
        run: |
          npm run build
          npm run build:exe-bundle
          npm run build:sea-config
          npm run build:sea-blob

      # This is Node's own documented recipe for a Single Executable
      # Application: copy the Node binary that is building it, then inject the
      # prepared blob (server code + embedded client assets) into that copy.
      # The result needs no Node.js installed on the machine that runs it.
      - name: Assemble Villaggio-Del-Sol.exe
        shell: bash
        run: |
          node -e "require('fs').copyFileSync(process.execPath, 'Villaggio-Del-Sol.exe')"
          npx --yes postject Villaggio-Del-Sol.exe NODE_SEA_BLOB dist/sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 \
            --overwrite

      # A headless CI runner has no Desktop folder, so the executable's shortcut
      # step (which skips gracefully when there is none) would have nothing to
      # write into. Create one first, so the verification below genuinely tests
      # the real-user case: given a normal Windows Desktop, is the shortcut made.
      - name: Ensure a Desktop folder exists for the shortcut test
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path (Join-Path $env:USERPROFILE 'Desktop') | Out-Null

      # Prove the artifact this workflow is about to publish actually starts,
      # serves the app with no dist/ folder alongside it, and answers a real
      # request — not just that the assembly steps above exited cleanly.
      #
      # Deliberately does NOT set NODE_ENV: an end user double-clicks the exe with
      # no environment variables at all, and setting NODE_ENV=production here once
      # hid a crash that only happened on that bare double-click (the server took
      # its dev branch and tried to import Vite, which is not bundled in). The
      # executable must detect it is packaged and run in production on its own.
      # VDS_OPEN_BROWSER=0 stops it launching a browser on the headless runner.
      - name: Smoke-test the built executable
        shell: bash
        run: |
          mkdir -p smoke-test-data
          VDS_DATA_DIR="$(pwd)/smoke-test-data" VDS_ADMIN_PASSWORD="CiSmokeTest#12345" \
            VDS_BACKUP_DIR="" PORT=3999 VDS_OPEN_BROWSER=0 \
            ./Villaggio-Del-Sol.exe > exe-console.log 2>&1 &
          SERVER_PID=$!
          ok=""
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3999/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "The executable did not answer /api/health in time."
            exit 1
          fi
          curl -sf http://127.0.0.1:3999/ | grep -q "Villaggio Del Sol"
          kill "$SERVER_PID" 2>/dev/null || true
          echo "----- the executable's own console output -----"
          cat exe-console.log || true

      # The executable creates the shortcut synchronously during start-up, so by
      # the time it answered /api/health above the shortcut must already exist.
      # None of this can be exercised on macOS or Linux, so this is the only real
      # verification that the PowerShell behind it works, on an actual Windows
      # machine, before every release. It caught a genuine bug once already: the
      # first version spawned a detached child and swallowed its errors, and
      # produced no shortcut at all while reporting success.
      - name: Verify the Desktop shortcut was created
        shell: pwsh
        run: |
          $shortcut = Join-Path $env:USERPROFILE "Desktop\Villaggio Del Sol.lnk"
          $found = $false
          for ($i = 0; $i -lt 20; $i++) {
            if (Test-Path $shortcut) { $found = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $found) {
            Write-Host "----- the executable's own console output -----"
            Get-Content exe-console.log -ErrorAction SilentlyContinue
            Write-Error "Desktop shortcut was not created at $shortcut"
            exit 1
          }
          Write-Host "Desktop shortcut created at $shortcut"

      - name: Upload the executable as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Villaggio-Del-Sol-exe
          path: Villaggio-Del-Sol.exe
          retention-days: 30

      - name: Publish to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Villaggio-Del-Sol.exe
          generate_release_notes: true
